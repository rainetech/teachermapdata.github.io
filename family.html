<title>MAP results</title>
<style>
  :root { --ink: #1c2433; --muted: #5a6478; --line: #d9dfeb; --bg: #f4f6fb; --card: #ffffff; --brand: #1d4ed8; --soft: #e8efff; --good: #0f7a3d; --warn: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e8ecf5; --muted: #a9b3c8; --line: #2b3448; --bg: #0f1420; --card: #171e2e; --brand: #8fb0ff; --soft: #1e2a47; --good: #6fd39a; --warn: #f1c46b; } }

  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Naskh Arabic", "Noto Sans Arabic", Arial, sans-serif; }

<div id="app"></div>
<script>
// The Family Plan's shared rules: what goes into a family link, how the page
// reads it back, which goal area a child is pointed to, and which areas and
// grade bands there are. No page, no storage, no network: build/check-family.mjs
// runs it in Node, and build/build-family.mjs copies it into the dashboard
// (where the link is made) and into the family page (where it is read).
//
// A link is  <page>#v=1&t=T1-2627&g=4&d=ma.205.62.55.198.213.num~rd.190.48...188.voc
//   v  format version        t  term: T1 fall, T2 winter, T3 spring, then the school year
//   g  grade, 0 for kindergarten
//   d  one record per subject, joined by ~, fields joined by . and left empty when
//      there is nothing to say:  subject . RIT . achievement percentile .
//      growth percentile . RIT at the start of the window . target RIT . goal area
// No name, no ID, no school: nothing that says who the child is.
const FamilyCore = (function () {
  const FORMAT_VERSION = 1;

  // How far below the overall RIT a goal area must sit before it is named. An
  // area RIT comes from far fewer questions than the overall score, so inside
  // this the profile is called balanced. 8 is the dashboard's own noise floor
  // for goal areas (AREA_MIN_FLOOR). One value, here.
  const AREA_GAP_RIT = 8;
  // Within this many RIT of the target, below it, is "close": a different day
  // could have gone either way. At or above it by this many is "above".
  const CLOSE_RIT = 3;
  const ABOVE_RIT = 3;

  const SUBJECTS = {
    ma: { en: "Mathematics", ar: "الرياضيات" },
    rd: { en: "Reading", ar: "القراءة" },
    lu: { en: "Language Usage", ar: "استخدام اللغة" },
    sc: { en: "Science", ar: "العلوم" }
  };

  // Grade bands, and the subjects each is offered in. Language Usage starts at
  // Grade 2 and Science at Grade 3 (NWEA's own tests start at Grade 2; a school's
  // data decides, and a record outside this still gets a page, just without
  // an activity set).
  const BAND_ORDER = ["k", "12", "35", "68", "911"];
  const BANDS = {
    k: { en: "KG2", ar: "رياض الأطفال", subjects: ["ma", "rd"] },
    "12": { en: "Grades 1 to 2", ar: "الصفان الأول والثاني", subjects: ["ma", "rd", "lu"] },
    "35": { en: "Grades 3 to 5", ar: "الصفوف من الثالث إلى الخامس", subjects: ["ma", "rd", "lu", "sc"] },
    "68": { en: "Grades 6 to 8", ar: "الصفوف من السادس إلى الثامن", subjects: ["ma", "rd", "lu", "sc"] },
    "911": { en: "Grades 9 to 11", ar: "الصفوف من التاسع إلى الحادي عشر", subjects: ["ma", "rd", "lu", "sc"] }
  };

  // The goal areas, grouped into the themes NWEA's own areas fall under across
  // its test versions (2015, 2017 and 2025 names all appear in exports). "match"
  // is tried in order against the name in the file. "bands" lists where an
  // activity set is wanted. "nwea" is NWEA's own 2025 wording, for the slot list.
  const AREAS = {
    ma: [
      { code: "alg", en: "Patterns, equations and algebra thinking", ar: "الأنماط والمعادلات والتفكير الجبري", match: /algebra|equations|functions|patterns/i, bands: ["k", "12", "35", "68", "911"], nwea: "Algebra" },
      { code: "geo", en: "Shapes, measuring and space", ar: "الأشكال والقياس والفراغ", match: /geometry|measurement/i, bands: ["k", "12", "35", "68", "911"], nwea: "Geometry; Measurement" },
      { code: "dat", en: "Data, graphs and chance", ar: "البيانات والرسوم البيانية والاحتمالات", match: /statistic|probability|data/i, bands: ["k", "12", "35", "68", "911"], nwea: "Probability & Statistics" },
      { code: "num", en: "Numbers and calculating", ar: "الأعداد والحساب", match: /number|computation|operations|numeric/i, bands: ["k", "12", "35", "68", "911"], nwea: "Number (Computation, Number Sense)" }
    ],
    rd: [
      { code: "fnd", en: "Sounds, letters and decoding", ar: "الأصوات والحروف وفك الرموز", match: /foundation|phonolog|phonic|concepts of print/i, bands: ["k", "12"], nwea: "Reading Foundations (K-2)" },
      { code: "cmp", en: "Understanding what you read", ar: "فهم المقروء", match: /comprehension/i, bands: ["k", "12"], nwea: "Reading Comprehension (K-2)" },
      { code: "voc", en: "Word meanings and how writers use words", ar: "معاني الكلمات وكيف يستخدمها الكتّاب", match: /vocab|word/i, bands: ["k", "12", "35", "68", "911"], nwea: "Vocabulary and Literary Devices" },
      { code: "inf", en: "Reading nonfiction", ar: "قراءة النصوص المعلوماتية", match: /nonfiction|non-fiction|informational/i, bands: ["35", "68", "911"], nwea: "Nonfiction" },
      { code: "lit", en: "Stories, poems and plays", ar: "القصص والقصائد والمسرحيات", match: /fiction|literar|poetry|literature/i, bands: ["35", "68", "911"], nwea: "Fiction, Poetry, and Drama" },
      { code: "wl", en: "Writing and language", ar: "الكتابة واللغة", match: /writing|language/i, bands: ["k", "12"], nwea: "Writing and Language (K-2)" }
    ],
    lu: [
      { code: "cps", en: "Capital letters, punctuation and spelling", ar: "الأحرف الكبيرة وعلامات الترقيم والهجاء", match: /capital|punctuation|spelling|mechanics/i, bands: ["12", "35", "68", "911"], nwea: "Capitalization, Punctuation, and Spelling" },
      { code: "gru", en: "Grammar and word usage", ar: "القواعد واستخدام الكلمات", match: /grammar|parts of speech|usage/i, bands: ["12", "35", "68", "911"], nwea: "Grammar and Usage" },
      { code: "wri", en: "Writing", ar: "الكتابة", match: /writing|composition|research|narrative|process/i, bands: ["12", "35", "68", "911"], nwea: "Narrative, Expository, and Argumentative Writing" }
    ],
    sc: [
      { code: "bio", en: "Living things", ar: "الكائنات الحية", match: /biolog|life|organism|ecosystem|heredity|inheritance/i, bands: ["35", "68", "911"], nwea: "Biology" },
      { code: "ear", en: "Earth and space", ar: "الأرض والفضاء", match: /earth|space/i, bands: ["35", "68", "911"], nwea: "Earth and Space Science" },
      { code: "phy", en: "Matter, forces and energy", ar: "المادة والقوى والطاقة", match: /physic|chemistry|matter|forces|energy/i, bands: ["35", "68", "911"], nwea: "Chemistry and Physics" }
    ]
  };

  function gradeBand(grade) {
    const text = String(grade === undefined || grade === null ? "" : grade).trim().toUpperCase();
    if (["K", "KG", "KG2", "KINDERGARTEN"].includes(text)) return "k";
    if (!/^\d{1,2}$/.test(text)) return null;
    const number = Number(text);
    if (number === 0) return "k";
    if (number <= 2) return "12";
    if (number <= 5) return "35";
    if (number <= 8) return "68";
    if (number <= 12) return "911";
    return null;
  }

  // The dashboard's subject names (Mathematics, Reading, Language, Science).
  function subjectCode(name) {
    const lower = String(name || "").toLowerCase();
    if (lower.includes("math")) return "ma";
    if (lower.includes("reading")) return "rd";
    if (lower.includes("language")) return "lu";
    if (lower.includes("science")) return "sc";
    return null;
  }

  // The theme a goal-area name from a file belongs to, or null.
  function areaCode(subject, name) {
    const list = AREAS[subject];
    const text = String(name || "").trim();
    if (!list || !text) return null;
    const found = list.find((area) => area.match.test(text));
    return found ? found.code : null;
  }

  function slotExists(subject, band, code) {
    if (code === "bal") return Boolean(BANDS[band] && BANDS[band].subjects.includes(subject));
    const found = (AREAS[subject] || []).find((area) => area.code === code);
    return Boolean(found && found.bands.includes(band));
  }

  // Which goal area to point to. areas: [{ name, rit }]. Returns
  //   null                        no area scores at all
  //   { balanced: true }          nothing sits more than gap below the overall RIT
  //   { balanced: false, code, name, delta }   the weakest; code is null when its
  //                               name is not one this knows
  function pickFocusArea(areas, overall, gap) {
    const limit = typeof gap === "number" ? gap : AREA_GAP_RIT;
    if (!Number.isFinite(overall)) return null;
    const scored = (areas || []).filter((area) => area && Number.isFinite(area.rit));
    if (!scored.length) return null;
    const weakest = scored.map((area) => ({ area, delta: area.rit - overall })).sort((a, b) => a.delta - b.delta)[0];
    if (!(weakest.delta < -limit)) return { balanced: true };
    return { balanced: false, name: weakest.area.name, delta: weakest.delta, code: weakest.area.code || null };
  }

  const SEASON_NUMBER = { fall: 1, winter: 2, spring: 3 };

  // "Fall" and the year the school year began (2026) -> "T1-2627".
  function termCode(season, startYear) {
    const number = SEASON_NUMBER[String(season || "").toLowerCase()];
    if (!number || !Number.isFinite(startYear)) return "";
    const first = String(Math.round(startYear) % 100).padStart(2, "0");
    const second = String((Math.round(startYear) + 1) % 100).padStart(2, "0");
    return "T" + number + "-" + first + second;
  }

  // A number that sorts terms in the order they happen, or null.
  function termOrder(code) {
    const match = /^T([123])-(\d{2})(\d{2})$/.exec(String(code || ""));
    if (!match) return null;
    if ((Number(match[2]) + 1) % 100 !== Number(match[3])) return null;
    return Number(match[2]) * 10 + Number(match[1]);
  }

  // How a result stands against its target.
  //   "above"   at or past the target by ABOVE_RIT or more
  //   "met"     at or past the target
  //   "close"   short of it by CLOSE_RIT or less
  //   "below"   short of it by more
  //   "target"  only a target for the next test exists (no result to judge yet)
  //   "none"    nothing to compare
  function progress(subject) {
    const rit = subject && subject.rit;
    const target = subject && subject.target;
    if (!Number.isFinite(target)) return "none";
    if (!Number.isFinite(subject.base) || !Number.isFinite(rit)) return "target";
    if (rit >= target + ABOVE_RIT) return "above";
    if (rit >= target) return "met";
    if (target - rit <= CLOSE_RIT) return "close";
    return "below";
  }

  const clean = (value) => (Number.isFinite(value) ? String(Math.round(value)) : "");

  // student: { term, grade, subjects: [{ subject, rit, ach, growthPct, base, target, area }] }
  function encode(student) {
    const records = (student.subjects || [])
      .filter((entry) => entry && SUBJECTS[entry.subject] && Number.isFinite(entry.rit))
      .map((entry) => {
        const fields = [entry.subject, clean(entry.rit), clean(entry.ach), clean(entry.growthPct), clean(entry.base), clean(entry.target), /^[a-z]{2,3}$/.test(entry.area || "") ? entry.area : ""];
        while (fields.length > 2 && fields[fields.length - 1] === "") fields.pop();
        return fields.join(".");
      });
    if (!records.length) return "";
    const grade = gradeBand(student.grade) === "k" ? "0" : String(student.grade).replace(/\D/g, "");
    return "v=" + FORMAT_VERSION + "&t=" + (student.term || "") + "&g=" + grade + "&d=" + records.join("~");
  }

  function whole(text, low, high) {
    if (text === "" || text === undefined) return null;
    if (!/^\d{1,3}$/.test(text)) return undefined;
    const value = Number(text);
    return value >= low && value <= high ? value : undefined;
  }

  // The fragment (with or without the #) -> what the page shows. Never throws.
  // { ok, reason, term, termOrder, grade, band, subjects: [...], warnings: [...] }
  function decode(fragment) {
    const result = { ok: false, reason: "", term: "", termOrder: null, grade: null, band: null, subjects: [], warnings: [] };
    const text = String(fragment || "").replace(/^#/, "");
    if (!text) { result.reason = "empty"; return result; }
    const pairs = {};
    text.split("&").forEach((part) => {
      const at = part.indexOf("=");
      if (at > 0) pairs[part.slice(0, at)] = part.slice(at + 1);
    });
    if (pairs.v !== String(FORMAT_VERSION)) { result.reason = "version"; return result; }
    result.term = /^T[123]-\d{4}$/.test(pairs.t || "") && termOrder(pairs.t) !== null ? pairs.t : "";
    result.termOrder = termOrder(result.term);
    if (!result.term) result.warnings.push("term");
    const grade = /^\d{1,2}$/.test(pairs.g || "") ? Number(pairs.g) : null;
    result.grade = grade;
    result.band = grade === null ? null : gradeBand(grade);
    if (result.band === null) result.warnings.push("grade");
    String(pairs.d || "").split("~").forEach((record) => {
      if (!record) return;
      const f = record.split(".");
      const subject = f[0];
      if (!SUBJECTS[subject]) { result.warnings.push("subject"); return; }
      const rit = whole(f[1], 100, 350);
      if (rit === null || rit === undefined) { result.warnings.push("rit:" + subject); return; }
      const read = (index, low, high) => { const value = whole(f[index], low, high); return value === undefined ? null : value; };
      let area = f[6] || "";
      if (area && area !== "bal" && !(AREAS[subject] || []).some((entry) => entry.code === area)) area = "";
      const entry = { subject, rit, ach: read(2, 1, 99), growthPct: read(3, 1, 99), base: read(4, 100, 350), target: read(5, 100, 350), area };
      entry.progress = progress(entry);
      result.subjects.push(entry);
    });
    result.ok = result.subjects.length > 0;
    if (!result.ok) result.reason = "nodata";
    return result;
  }

  // The slots an activity set is wanted for: every area in every band it is
  // offered in, and one balanced set for each subject in each band.
  function allSlots() {
    const slots = [];
    BAND_ORDER.forEach((band) => {
      BANDS[band].subjects.forEach((subject) => {
        (AREAS[subject] || []).filter((area) => area.bands.includes(band)).forEach((area) => {
          slots.push({ key: subject + "." + band + "." + area.code, subject, band, code: area.code, kind: "area" });
        });
        slots.push({ key: subject + "." + band + ".bal", subject, band, code: "bal", kind: "balanced" });
      });
    });
    return slots;
  }

  return { FORMAT_VERSION, AREA_GAP_RIT, CLOSE_RIT, ABOVE_RIT, SUBJECTS, BAND_ORDER, BANDS, AREAS, gradeBand, subjectCode, areaCode, slotExists, pickFocusArea, termCode, termOrder, progress, encode, decode, allSlots };
})();

// Everything the family page says that is not an activity, in English and
// Arabic. {name} is filled in from the child's numbers. No em dashes anywhere
// (build/check-family.mjs checks), nothing that blames, and every hard thing
// points back to the teacher. Arabic is a first draft for a native reader to
// review before it goes to families.
const FamilyStrings = {
  en: {
    dir: "ltr",
    langName: "English",
    switchTo: "العربية",
    pageTitle: "Your child's MAP results",
    heading: "Your child's MAP results",
    grade: "Grade {g}",
    kindergarten: "KG2",
    seasons: { 1: "Fall", 2: "Winter", 3: "Spring" },
    stale: "These are earlier results. Ask the teacher for the latest goal sheet.",
    unreadable: "This link could not be read. Please scan the code on the goal sheet again, or ask the teacher for a new sheet.",
    unreadableVersion: "This link was made for a different version of this page. Please ask the teacher for a new goal sheet.",
    mapHeading: "What is MAP?",
    map: [
      "MAP Growth is a computer test your child takes in school, usually twice a year, in the fall (start of the year) and the spring (towards the end of the year), and sometimes also in the winter.",
      "It adapts as your child answers: questions get harder after correct answers and easier after incorrect ones, so it finds the level where your child is learning now.",
      "It is not a pass or fail exam and it does not affect report card grades. Teachers use it to see what each child is ready to learn next and how much they have grown.",
      "The results below are a starting point for a conversation with your child's teacher."
    ],
    readMore: "Read more in NWEA's family guide",
    glanceHeading: "Results at a glance",
    now: "Now",
    start: "Start",
    target: "Target",
    percentile: "Percentile",
    rit: "RIT",
    howHeading: "How to read these numbers",
    ritHeading: "RIT: a learning level",
    ritText: "RIT is a score on a scale that estimates where your child is learning now. Your child's {subject} RIT is {n}. It is not a percentage, not a mark out of 100 and not a reading age. A {subject} RIT and a RIT in another subject cannot be compared with each other.",
    pctHeading: "Achievement percentile: a comparison",
    pctText: "The achievement percentile compares your child with students in the NWEA US norm group in the same grade, subject and time of year. In {subject} it is {n}, which means your child scored the same as or higher than about {n} out of 100 students in that group. It is not the percentage of questions answered correctly and it is not a class ranking.",
    growthHeading: "Growth: a different measure",
    growthText: "Growth is about change, not level. The target is the number of RIT points NWEA projects a student like your child to gain between the fall test and the latest test (winter or spring). Achievement says where your child is. Growth says how far they have moved. They are different, and a number that is blank means it is not available, not that it is zero.",
    pctBandLow: "Below the 41st percentile. Your child is working below the typical range for the grade in {subject}. That tells us where extra help is likely to make the biggest difference. It is a starting point, not a verdict.",
    pctBandMid: "Between the 41st and 60th percentile. Your child is working within the typical range for the grade in {subject}. Steady practice at home helps keep that going.",
    pctBandHigh: "At or above the 61st percentile. Your child is working above the typical range for the grade in {subject}. Keep them curious and give them harder questions to enjoy.",
    pctMissing: "The achievement percentile is not available for {subject}.",
    progressAbove: "Your child scored {r}. The target was {t}. That is above the target. Well done to your child.",
    progressMet: "Your child scored {r}. The target was {t}. That meets the target, so progress is as expected.",

// The family page: reads the link's fragment, fills the sentences in, shows
// them in English or Arabic. Nothing is stored, sent or tracked; the numbers
// are only ever in this page's own memory. FAMILY_LATEST_TERM is filled in by
// build/build-family.mjs from family/config.json.
(function () {
  "use strict";
  const Core = FamilyCore;
  const Strings = FamilyStrings;
  const Activities = FamilyActivities;
  const LATEST_TERM = "T1-2627";
  const NWEA_FAMILY_URL = "https://www.nwea.org/resource-center/topic/family-toolkit/";

  const decoded = Core.decode(window.location.hash);
  let lang = /^ar/i.test(navigator.language || "") ? "ar" : "en";

  const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const say = (key, params) => String(Strings[lang][key]).replace(/\{(\w+)\}/g, (all, name) => (params && params[name] !== undefined ? params[name] : all));
  const subjectName = (code) => Core.SUBJECTS[code][lang];

  function termLabel(code) {
    const match = /^T([123])-(\d{2})(\d{2})$/.exec(code || "");
    if (!match) return "";
    const year = 2000 + Number(match[2]) + (match[1] === "1" ? 0 : 1);
    return Strings[lang].seasons[Number(match[1])] + " " + year;
  }

  function gradeLabel() {
    if (decoded.grade === null) return "";
    return decoded.grade === 0 ? Strings[lang].kindergarten : say("grade", { g: decoded.grade });
  }

  function areaOf(subject, code) {
    return (Core.AREAS[subject] || []).find((area) => area.code === code) || null;
  }

  // What to show for one subject's activity: the set, and which heading and why.
  function slotFor(entry) {
    const band = decoded.band;
    let code = entry.area;
    if (!band) return { kind: "none", set: null };
    if (code && code !== "bal" && !Core.slotExists(entry.subject, band, code)) code = "";
    if (code && code !== "bal") {
      return { kind: "area", code, set: Activities[entry.subject + "." + band + "." + code] || null };
    }
    const balancedSet = Activities[entry.subject + "." + band + ".bal"] || null;
    return { kind: code === "bal" ? "balanced" : "general", code: "bal", set: balancedSet };
  }

  function pctBand(entry) {
    if (entry.ach === null) return say("pctMissing", { subject: subjectName(entry.subject) });
    const key = entry.ach < 41 ? "pctBandLow" : entry.ach < 61 ? "pctBandMid" : "pctBandHigh";
    return say(key, { subject: subjectName(entry.subject) });
  }

  function progressText(entry) {
    const subject = subjectName(entry.subject);
    const gap = Number.isFinite(entry.target) && Number.isFinite(entry.rit) ? Math.abs(entry.target - entry.rit) : 0;
    const params = { subject, r: entry.rit, t: entry.target, d: gap };
    if (entry.progress === "above") return say("progressAbove", params);
    if (entry.progress === "met") return say("progressMet", params);
    if (entry.progress === "close") return say("progressClose", params);
    if (entry.progress === "below") return say("progressBelow", params);
    if (entry.progress === "target") return say("progressTarget", Object.assign(params, { d: entry.target - entry.rit }));
    return say("progressNone", params);
  }

  function meter(entry) {
    if (!Number.isFinite(entry.base) || !Number.isFinite(entry.target)) return "";
    const values = [entry.base, entry.rit, entry.target];
    const low = Math.min(...values) - 3;
    const high = Math.max(...values) + 3;
    const at = (value) => Math.round(((value - low) / (high - low)) * 100);
    const mark = (cls, value, label) => '<span class="mk ' + cls + '" style="left:' + at(value) + '%"><b>' + esc(value) + "</b><i>" + esc(label) + "</i></span>";
    return '<div class="track" dir="ltr" aria-hidden="true"><span class="fill" style="left:' + at(entry.base) + "%;width:" + Math.max(0, at(entry.rit) - at(entry.base)) + '%"></span>' +
      mark("m-start", entry.base, Strings[lang].start) + mark("m-now", entry.rit, Strings[lang].now) + mark("m-target", entry.target, Strings[lang].target) + "</div>";
  }

  function pick(value) {
    return value && typeof value === "object" && (value[lang] !== undefined) ? value[lang] : value;
  }

  function activityBlock(entry, slot) {
    const name = subjectName(entry.subject);
    const set = slot.set;
    const area = slot.kind === "area" ? areaOf(entry.subject, slot.code) : null;
    let heading;
    let why;
    if (slot.kind === "area") { heading = say("focusHeading", { area: area ? area[lang] : "" }); why = say("focusWhy", { subject: name }); }
    else if (slot.kind === "balanced") { heading = say("balancedHeading"); why = say("balancedWhy", { subject: name }); }
    else { heading = say("noAreaHeading"); why = say("noAreaWhy", { subject: name }); }
    let html = '<div class="focus"><h4>' + esc(heading) + "</h4><p>" + esc(why) + "</p>";
    if (!set) return html + "<p>" + esc(say("fallbackActivity", { subject: name })) + "</p></div>";
    html += "<h5>" + esc(say("activitiesHeading")) + "</h5><ul>" + set.activities.map((item) => {
      const text = item[lang];
      return "<li><b>" + esc(text.title) + ".</b> " + esc(text.text) + "</li>";
    }).join("") + "</ul>";
    const example = set.example[lang];
    const exampleEnglish = set.sheet && set.sheet.englishOnly;
    html += '<div class="example"><h5>' + esc(say("exampleHeading")) + "</h5>" +
      '<p class="q"' + (exampleEnglish ? ' dir="ltr" lang="en"' : "") + ">" + esc(example.question) + "</p><ol>" +
      example.steps.map((step) => "<li>" + esc(step) + "</li>").join("") + "</ol><p><b>" + esc(example.answer) + "</b></p></div>";
    html += '<button type="button" class="btn" data-sheet="' + esc(entry.subject) + '">' + esc(say("sheetButton")) + "</button></div>";
    return html;
  }

  function sheetBlock(entry, slot) {
    const set = slot.set;
    if (!set || !set.sheet) return "";
    const sheet = set.sheet;
    const english = Boolean(sheet.englishOnly);
    const text = (value) => (english ? value.en : value[lang]);
    const wrap = english ? ' dir="ltr" lang="en"' : "";
    const items = sheet.items.map((item) => "<li" + wrap + ">" + esc(text(item.q)) + '<span class="line"></span></li>').join("");
    const answers = sheet.items.map((item) => "<li" + wrap + ">" + esc(text(item.a)) + "</li>").join("");
    return '<section class="sheet" id="sheet-' + esc(entry.subject) + '"><h2>' + esc(say("sheetTitle")) + ": " + esc(sheet.title[lang]) + "</h2><p>" + esc(say("sheetFor", { subject: subjectName(entry.subject) })) + " &middot; " +
      esc(say("sheetName")) + ': <span class="line wide"></span></p><p>' + esc(sheet.instructions[lang]) + "</p>" +
      (english && lang === "ar" ? "<p>" + esc(say("sheetEnglishNote")) + "</p>" : "") + "<ol>" + items + '</ol><div class="answers"><h3>' + esc(say("sheetAnswers")) + "</h3><ol>" + answers + "</ol></div></section>";
  }

  function subjectSection(entry) {
    const name = subjectName(entry.subject);
    const slot = slotFor(entry);
    let html = '<section class="card subject" id="subject-' + esc(entry.subject) + '"><h3>' + esc(name) + "</h3>";
    html += "<p>" + esc(pctBand(entry)) + "</p>";
    html += meter(entry) + "<p>" + esc(progressText(entry)) + "</p>";
    if (entry.growthPct !== null) html += "<p>" + esc(say("growthPct", { n: entry.growthPct })) + "</p>";
    html += activityBlock(entry, slot) + "</section>";
    return { html, sheet: sheetBlock(entry, slot) };
  }

  function glance(entry) {
    const parts = ['<div class="g-subject">' + esc(subjectName(entry.subject)) + "</div>", '<div class="g-num"><b>' + esc(entry.rit) + "</b><i>" + esc(say("rit")) + " " + esc(say("now")) + "</i></div>"];
    if (Number.isFinite(entry.target)) parts.push('<div class="g-num"><b>' + esc(entry.target) + "</b><i>" + esc(say("target")) + "</i></div>");
    if (entry.ach !== null) parts.push('<div class="g-num"><b>' + esc(entry.ach) + "</b><i>" + esc(say("percentile")) + "</i></div>");
    return '<button type="button" class="g-card" data-go="subject-' + esc(entry.subject) + '">' + parts.join("") + "</button>";
  }

  function render() {
    const root = document.getElementById("app");
    const text = Strings[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = text.dir;
    document.title = text.pageTitle;
    const toggle = '<button type="button" class="btn lang" id="langToggle">' + esc(text.switchTo) + "</button>";
    let html = '<header class="top"><h1>' + esc(text.heading) + "</h1>" + toggle + "</header>";

    if (!decoded.ok) {
      html += '<div class="note warn" role="alert">' + esc(decoded.reason === "version" ? text.unreadableVersion : text.unreadable) + "</div>";
      html += mapSection() + '<footer>' + esc(text.footer) + "</footer>";
      root.innerHTML = html;
      return;
    }

    const bits = [gradeLabel(), termLabel(decoded.term)].filter(Boolean);
    html += '<p class="meta">' + esc(bits.join(" · ")) + "</p>";
    const stale = decoded.termOrder !== null && Core.termOrder(LATEST_TERM) !== null && decoded.termOrder < Core.termOrder(LATEST_TERM);
    if (stale) html += '<div class="note" role="note">' + esc(text.stale) + "</div>";
    html += mapSection();

    html += '<section class="card"><h2>' + esc(text.glanceHeading) + '</h2><div class="glance">' + decoded.subjects.map(glance).join("") + "</div></section>";

    const first = decoded.subjects[0];
    const firstName = subjectName(first.subject);
    html += '<section class="card"><h2>' + esc(text.howHeading) + "</h2>" +
      "<h3>" + esc(text.ritHeading) + "</h3><p>" + esc(say("ritText", { subject: firstName, n: first.rit })) + "</p>" +
      "<h3>" + esc(text.pctHeading) + "</h3><p>" + esc(first.ach !== null ? say("pctText", { subject: firstName, n: first.ach }) : say("pctMissing", { subject: firstName })) + "</p>" +
      "<h3>" + esc(text.growthHeading) + "</h3><p>" + esc(text.growthText) + "</p></section>";

    const sheets = [];
    decoded.subjects.forEach((entry) => {
      const built = subjectSection(entry);
      html += built.html;
      if (built.sheet) sheets.push(built.sheet);
    });

    html += '<section class="card"><h2>' + esc(text.planHeading) + "</h2><ul>" + text.plan.map((line) => "<li>" + esc(line) + "</li>").join("") + "</ul></section>";
    html += '<section class="card"><h2>' + esc(text.askHeading) + "</h2><ul>" + text.ask.map((line) => "<li>" + esc(line) + "</li>").join("") + "</ul></section>";
    html += '<section class="card"><h2>' + esc(text.faqHeading) + "</h2>" + text.faq.map((pair) => "<details><summary>" + esc(pair[0]) + "</summary><p>" + esc(pair[1]) + "</p></details>").join("") + "</section>";
    html += "<footer>" + esc(text.footer) + "</footer>";
    html += '<div id="sheets">' + sheets.join("") + "</div>";
    root.innerHTML = html;
  }

  function mapSection() {
    const text = Strings[lang];
    return '<section class="card map"><h2>' + esc(text.mapHeading) + "</h2>" + text.map.map((line) => "<p>" + esc(line) + "</p>").join("") +
      '<p><a href="' + NWEA_FAMILY_URL + '" rel="noopener noreferrer">' + esc(text.readMore) + "</a></p></section>";
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest ? event.target.closest("button, a") : null;
    if (!target) return;
    if (target.id === "langToggle") { lang = lang === "en" ? "ar" : "en"; render(); return; }
    if (target.dataset && target.dataset.sheet) {
      const sheet = document.getElementById("sheet-" + target.dataset.sheet);
      if (!sheet) return;
      document.body.setAttribute("data-printing", target.dataset.sheet);
      sheet.classList.add("is-printing");
      window.print();
      sheet.classList.remove("is-printing");
      document.body.removeAttribute("data-printing");
      return;
    }
    if (target.dataset && target.dataset.go) {
      event.preventDefault();
      const node = document.getElementById(target.dataset.go);
      if (node) node.scrollIntoView();
    }
  });

  window.addEventListener("hashchange", () => window.location.reload());
  render();
})();
</script>
